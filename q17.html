
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            width: 700px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 9px 15px;
            margin: 5px;
            cursor: pointer;
        }

        .product {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }

        .summary {
            background-color: #f5f5f5;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
        }

        .final {
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Shopping Cart</h1>

    <input type="text" id="productName" placeholder="Product Name">

    <input type="number" id="productPrice" placeholder="Price">

    <input type="number" id="productQuantity" placeholder="Quantity">

    <button onclick="addProduct()">Add Product</button>

    <div id="products"></div>

    <div class="summary">

        <h3>Total Bill: ₹<span id="bill">0</span></h3>

        <h3>Discount: ₹<span id="discount">0</span></h3>

        <h2 class="final">
            Final Amount: ₹<span id="finalAmount">0</span>
        </h2>

    </div>

</div>


<script>

    const products = [];

    function addProduct() {

        const name =
            document.getElementById("productName").value;

        const price =
            Number(
                document.getElementById("productPrice").value
            );

        const quantity =
            Number(
                document.getElementById("productQuantity").value
            );

        if (name === "" || price <= 0 || quantity <= 0) {
            alert("Please enter valid details");
            return;
        }

        const product = {
            id: products.length + 1,
            name: name,
            price: price,
            quantity: quantity
        };

        products.push(product);

        displayProducts();

        document.getElementById("productName").value = "";
        document.getElementById("productPrice").value = "";
        document.getElementById("productQuantity").value = "";
    }


    function displayProducts() {

        const productDiv =
            document.getElementById("products");

        productDiv.innerHTML = "";

        products.forEach(function(product) {

            const total =
                product.price * product.quantity;

            productDiv.innerHTML += `
                <div class="product">

                    <h3>${product.name}</h3>

                    <p>Price: ₹${product.price}</p>

                    <p>Quantity: ${product.quantity}</p>

                    <p>Product Total: ₹${total}</p>

                </div>
            `;
        });

        calculateBill();
    }


    function calculateBill() {

        let bill = 0;

        products.forEach(function(product) {

            bill =
                bill +
                (product.price * product.quantity);
        });

        let discount = 0;

        if (bill > 5000) {
            discount = bill * 0.10;
        }

        const finalAmount =
            bill - discount;

        document.getElementById("bill").innerText =
            bill;

        document.getElementById("discount").innerText =
            discount;

        document.getElementById("finalAmount").innerText =
            finalAmount;
    }

</script>

</body>
</html>
