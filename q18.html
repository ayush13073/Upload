
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .quiz {
            width: 600px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .option {
            display: block;
            padding: 10px;
            margin: 8px 0;
            background-color: #f5f5f5;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="quiz">

    <h1>JavaScript Quiz</h1>

    <h2 id="question"></h2>

    <div id="options"></div>

    <button onclick="nextQuestion()">Next</button>

    <button onclick="restartQuiz()">Restart</button>

    <h3 id="result"></h3>

</div>

<script>

    const questions = [

        {
            question: "Which keyword is used to declare a variable?",
            options: ["var", "int", "string", "define"],
            answer: "var"
        },

        {
            question: "Which keyword is used to declare a constant?",
            options: ["let", "var", "const", "constant"],
            answer: "const"
        },

        {
            question: "Which method is used to display output in the console?",
            options: [
                "console.log()",
                "print()",
                "display()",
                "write()"
            ],
            answer: "console.log()"
        },

        {
            question: "Which symbol is used for a single-line comment?",
            options: ["//", "##", "<!--", "**"],
            answer: "//"
        },

        {
            question: "Which method is used to select an element by its ID?",
            options: [
                "getElementById()",
                "getElement()",
                "selectById()",
                "findElement()"
            ],
            answer: "getElementById()"
        }

    ];


    let currentQuestion = 0;

    let score = 0;


    function displayQuestion() {

        const question =
            questions[currentQuestion];

        document.getElementById("question").innerText =
            question.question;

        const options =
            document.getElementById("options");

        options.innerHTML = "";

        question.options.forEach(function(option) {

            options.innerHTML += `
                <label class="option">
                    <input
                        type="radio"
                        name="answer"
                        value="${option}"
                    >
                    ${option}
                </label>
            `;

        });
    }


    function nextQuestion() {

        const selected =
            document.querySelector(
                'input[name="answer"]:checked'
            );

        if (!selected) {

            alert("Please select an answer");

            return;
        }

        if (
            selected.value ===
            questions[currentQuestion].answer
        ) {

            score++;
        }

        currentQuestion++;

        if (currentQuestion < questions.length) {

            displayQuestion();

        } else {

            showResult();

        }
    }


    function showResult() {

        const percentage =
            (score / questions.length) * 100;

        let result;

        if (percentage >= 60) {

            result = "Pass";

        } else {

            result = "Fail";
        }

        document.getElementById("question").innerText =
            "Quiz Completed";

        document.getElementById("options").innerHTML = "";

        document.getElementById("result").innerText =
            "Score: " +
            score +
            "/" +
            questions.length +
            " - " +
            result;
    }


    function restartQuiz() {

        currentQuestion = 0;

        score = 0;

        document.getElementById("result").innerText = "";

        displayQuestion();
    }


    displayQuestion();

</script>

</body>
</html>
